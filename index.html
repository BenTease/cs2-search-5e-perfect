<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5E × 完美 全平台查成分</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#FB7299',
                        secondary: '#3B82F6',
                        dark: {
                            bg: '#0F172A',
                            card: '#1E293B',
                            border: '#334155'
                        }
                    },
                    fontFamily: {
                        sans: ['Microsoft YaHei', 'Segoe UI', 'SimHei', 'sans-serif']
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-in-out'
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(6px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .player-card {
            animation: fadeIn .3s ease-in-out;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-dark-bg dark:text-gray-100 transition-colors duration-300">
<header class="bg-gradient-to-r from-primary to-secondary text-white shadow-lg">
    <div class="container mx-auto px-4 py-6">
        <div class="flex justify-between items-center">
            <h1 class="text-[clamp(1.5rem,3vw,2.5rem)] font-bold">5E × 完美 查成分</h1>
            <button id="themeToggle" class="bg-white/20 hover:bg-white/30 transition-colors px-4 py-2 rounded-lg flex items-center gap-2">
                <i class="fa fa-moon-o dark:hidden"></i>
                <i class="fa fa-sun-o hidden dark:inline-block"></i>
                <span class="dark:hidden">暗色模式</span>
                <span class="hidden dark:inline-block">亮色模式</span>
            </button>
        </div>
        <p class="mt-2 opacity-90">输入昵称或 SteamID，一次拉取 5E / 完美 / Steam 三方数据（查到哪个先显示哪个）</p>
    </div>
</header>

<main class="container mx-auto px-4 py-8">
    <!-- 搜索区 -->
    <div class="bg-white dark:bg-dark-card rounded-xl shadow-md p-6 mb-8">
        <!-- 查询模式：两个按钮切换，决定用哪个平台查昵称 -->
        <div class="flex flex-wrap items-center gap-3 mb-4">
            <div id="modeSwitcher" class="inline-flex p-1 rounded-lg bg-gray-100 dark:bg-dark-bg">
                <button data-mode="5e" class="mode-btn">用 5E 昵称查</button>
                <button data-mode="perfect" class="mode-btn">用完美昵称查</button>
            </div>
            <span class="text-xs text-gray-400 dark:text-gray-500">输入 SteamID（76 开头 17 位）时会自动同时查两个平台</span>
        </div>

        <div class="flex flex-col md:flex-row gap-3">
            <input
                type="text"
                id="searchInput"
                placeholder="输入 5E 昵称（或 SteamID）"
                class="flex-1 px-4 py-3 rounded-lg border border-gray-200 dark:border-dark-border bg-white dark:bg-dark-bg focus:outline-none focus:ring-2 focus:ring-primary transition-all"
            >
            <button
                id="searchButton"
                class="bg-primary hover:bg-primary/90 text-white px-6 py-3 rounded-lg font-medium transition-all transform hover:-translate-y-0.5 hover:shadow-lg flex items-center justify-center gap-2"
            >
                <i class="fa fa-search"></i>
                <span>搜索</span>
            </button>
        </div>

        <div id="searchHint" class="mt-3 text-sm text-gray-500 dark:text-gray-400"></div>

        <!-- 同名候选 -->
        <div id="candidatesBar" class="mt-3 hidden flex-wrap gap-2"></div>
    </div>

    <!-- 结果 -->
    <div id="resultsContainer" class="space-y-6"></div>

    <!-- 初始状态 -->
    <div id="initialState" class="text-center py-16 border border-dashed border-gray-200 dark:border-dark-border rounded-xl bg-white dark:bg-dark-card m-4">
        <i class="fa fa-search text-4xl text-gray-300 dark:text-gray-600 mb-4"></i>
        <p class="text-gray-500 dark:text-gray-400">输入 5E 昵称 / 完美昵称 / SteamID 开始查询</p>
        <p class="text-xs text-gray-400 dark:text-gray-500 mt-2">例：Sky_Bendou、洛琪希喵、76561199012971728</p>
    </div>
</main>

<footer class="bg-white dark:bg-dark-card border-t border-gray-200 dark:border-dark-border py-4 mt-12">
    <div class="container mx-auto px-4 text-center text-gray-500 dark:text-gray-400 text-sm">
        <p>5E × 完美查成分 &copy; 2026 | 数据来源：5E 平台 / 完美平台 / Steam</p>
    </div>
</footer>

<script src="stecit/5ePlayApi.js"></script>
<script src="stecit/perfectApi.js"></script>
<script src="stecit/copy-toast.js"></script>
<script src="stecit/app.js"></script>
</body>
</html>
